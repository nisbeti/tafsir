<p>It contains a rope extended to you so that you do not become negligent regarding it, and the word &quot;stoned&quot; so that fear of it does not reach an immense level; it is indeed a stoned (rajim) one. (39)</p>
<p>__________</p>
<p>(39) Dr. Hussam al-Nuaimi.</p>
