<p>فيه حبل ممتد إليك حتى لا تتهاون في شأنه وكلمة رجيم حتى  لا يبلغ بك الخوف منه مبلغاً عظيماً فهو رجيم مرجوم(39).</p>
<p>__________</p>
<p>(39) الدكتور حسام النعيمي.</p>
