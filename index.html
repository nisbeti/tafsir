<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tafsir</title>
<meta name="description" content="A growing library of tafsir books, readable in Arabic and English.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f6f0e2; --surface:#fffaf0; --text:#2a2017; --muted:#76664f; --accent:#8a5a2b; --border:#e2d4b8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15120e; --surface:#1e1914; --text:#ece2cf; --muted:#a8977e; --accent:#d9a766; --border:#3a3127; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:Georgia,serif; line-height:1.5; }
  main { max-width:40rem; margin:0 auto; padding:3rem 1rem; }
  h1 { text-align:center; margin:0 0 .25rem; font-size:2rem; }
  .sub { text-align:center; color:var(--muted); margin:0 0 2rem; }
  ul { list-style:none; margin:0; padding:0; display:grid; gap:.75rem; }
  a.book { display:flex; justify-content:space-between; align-items:center; gap:1rem; padding:1rem 1.25rem;
    background:var(--surface); border:1px solid var(--border); border-radius:10px; color:inherit; text-decoration:none; }
  a.book:hover, a.book:focus-visible { border-color:var(--accent); }
  .en { font-size:1.05rem; }
  .ar { font-family:Amiri,serif; font-size:1.5rem; color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Tafsir</h1>
  <p class="sub">Choose a book</p>
  <ul id="books"></ul>
  <noscript><p class="sub"><a href="fatihah/index.html">Commentary on Surat al-Fatiha</a></p></noscript>
</main>
<script>
fetch('books.json').then(r => r.json()).then(books => {
  const list = document.getElementById('books');
  books.forEach(b => {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.className = 'book';
    a.href = b.path + 'index.html';
    a.innerHTML = '<span class="en"></span><span class="ar" lang="ar" dir="rtl"></span>';
    a.querySelector('.en').textContent = b.en;
    a.querySelector('.ar').textContent = b.ar;
    li.appendChild(a);
    list.appendChild(li);
  });
});
</script>
</body>
</html>
